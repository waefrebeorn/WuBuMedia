<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WuBuDesk — the wizard in your computer (Interactive Buddy)</title>
<!-- SPDX-License-Identifier: WaefreBeorn-UMV3 -->
<!-- Interactive Buddy cohost: you can GRAB / FLING / POKE the sigil and it
     reacts with physics + personality. State is pushed to face_state.json by
     wubudesk_loop.py; interaction impulses are POSTed to the loop via the
     browser bridge (WS :18765) so the online brain can quip back.
     Falls back to localStorage echo if the bridge is absent (OBS-safe). -->
<style>
  :root{
    --neon:#39ff14; --neon2:#00e5ff; --warn:#ffd166; --sad:#7aa2ff; --angry:#ff5d5d;
    --bg: rgba(0,0,0,0);
  }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:"Segoe UI",system-ui,sans-serif;cursor:grab;}
  body.grabbing{cursor:grabbing;}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;padding-bottom:5vh;gap:10px;}

  /* ---- the sigil: a rotating rune ring + the all-seeing eye ---- */
  #sigil{position:relative;width:180px;height:180px;will-change:transform;
    touch-action:none;user-select:none;}
  #ring{position:absolute;inset:0;border-radius:50%;
    border:2px solid var(--neon);border-top-color:transparent;border-left-color:transparent;
    box-shadow:0 0 22px var(--neon),inset 0 0 18px rgba(57,255,20,.25);
    animation:spin 9s linear infinite;}
  #ring2{position:absolute;inset:18px;border-radius:50%;
    border:1px dashed var(--neon2);border-bottom-color:transparent;
    box-shadow:0 0 14px var(--neon2);animation:spin 6s linear infinite reverse;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #eye{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:74px;height:74px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,#031 0%,#012 70%);
    box-shadow:0 0 26px var(--neon),inset 0 0 16px rgba(0,229,255,.4);
    overflow:hidden;}
  #iris{position:absolute;top:50%;left:50%;width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,var(--neon2),var(--neon) 70%,#063 100%);
    box-shadow:0 0 18px var(--neon);transform:translate(-50%,-50%);
    transition:transform .08s ease-out;}
  #pupil{position:absolute;top:50%;left:50%;width:12px;height:12px;border-radius:50%;
    background:#000;transform:translate(-50%,-50%);transition:transform .08s ease-out;}
  #lid{position:absolute;inset:0;background:#012;border-radius:50%;
    transform:scaleY(0);transform-origin:center;transition:transform .12s ease;}
  #mouth{position:absolute;top:78%;left:50%;transform:translate(-50%,-50%) scaleY(0.05);
    width:26px;height:14px;background:#012;border-radius:0 0 14px 14px;
    box-shadow:0 0 8px var(--neon);transition:transform .06s linear;opacity:.9;}
  body.blink #lid{transform:scaleY(1);}
  #glint{position:absolute;top:38%;left:42%;width:10px;height:10px;border-radius:50%;
    background:rgba(255,255,255,.85);filter:blur(1px);}

  /* squish on poke/fling */
  #sigil.hit{animation:squish .28s ease;}
  @keyframes squish{0%{transform:scale(1,1)}30%{transform:scale(1.25,.7)}60%{transform:scale(.85,1.15)}100%{transform:scale(1,1)}}

  #hud{display:flex;gap:14px;color:#9fe;font-family:"Consolas",monospace;font-size:12px;
    text-shadow:0 0 6px var(--neon);opacity:.82;}
  .stat{background:rgba(8,16,12,.35);border:1px solid rgba(57,255,20,.3);
    border-radius:8px;padding:3px 9px;backdrop-filter:blur(2px);}
  .stat b{color:var(--neon);}
  #name{color:var(--neon);font-weight:800;letter-spacing:3px;font-size:20px;
    text-shadow:0 0 12px var(--neon);}
  #ticker{max-width:72vw;color:#bfe;font-size:15px;text-align:center;
    text-shadow:0 0 8px #0f0;min-height:20px;line-height:1.35;}
  #mode{position:fixed;top:12px;right:16px;color:#8fa;font-size:12px;
    font-family:monospace;opacity:.7;}

  body[data-mood="happy"]  #ring,#eye{box-shadow:0 0 26px var(--neon),inset 0 0 16px rgba(57,255,20,.4);}
  body[data-mood="happy"]  #iris{background:radial-gradient(circle at 50% 40%,#aaffaa,var(--neon) 70%,#063 100%);}
  body[data-mood="thinking"] #sigil{animation:float 2.2s ease-in-out infinite;}
  body[data-mood="thinking"] #ring{animation:spin 3s linear infinite;}
  body[data-mood="sad"]   #eye,#ring{box-shadow:0 0 22px var(--sad),inset 0 0 14px rgba(122,162,255,.4);}
  body[data-mood="sad"]   #iris{background:radial-gradient(circle at 50% 40%,#cdd9ff,var(--sad) 70%,#023 100%);}
  body[data-mood="angry"] #eye,#ring{box-shadow:0 0 26px var(--angry),inset 0 0 16px rgba(255,93,93,.4);}
  body[data-mood="angry"] #iris{background:radial-gradient(circle at 50% 40%,#ffb3b3,var(--angry) 70%,#300 100%);}
  body[data-mood="dizzy"] #sigil{animation:wobble .5s ease-in-out infinite;}
  @keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

  .p{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--neon);
    box-shadow:0 0 8px var(--neon);opacity:.5;animation:drift linear infinite;}
  @keyframes drift{from{transform:translateY(100vh);}to{transform:translateY(-10vh);}}
  #hint{position:fixed;bottom:8px;left:10px;color:#6a8;font-size:11px;opacity:.5;font-family:monospace;}
</style>
</head>
<body data-mood="neutral" data-mode="live">
  <div id="mode">WuBuDesk · UMV3 · LIVE</div>
  <div id="stage">
    <div id="hat"><div id="hatbrim"></div><div id="hatcone"></div><div id="sigilmark">W·B</div></div>
    <div id="sigil">
      <div id="ring"></div><div id="ring2"></div>
      <div id="eye"><div id="iris"><div id="pupil"></div></div><div id="glint"></div><div id="lid"></div></div>
      <div id="mouth"></div>
    </div>
    <div id="hud">
      <span class="stat">GPU <b id="s_gpu">2080S</b></span>
      <span class="stat">CPU <b id="s_cpu">R5-3600</b></span>
      <span class="stat">BRAIN <b id="s_brain">NVIDIA</b></span>
      <span class="stat">ETHOS <b id="s_ethos">stream</b></span>
    </div>
    <div id="name">WuBuDesk</div>
    <div id="ticker">online · grab me, fling me, poke me — I'm your Interactive Buddy</div>
  </div>
  <div id="hint">drag = grab · flick = throw · tap = poke</div>
<script>
  // ambient particles
  for(let i=0;i<14;i++){const d=document.createElement('div');d.className='p';
    d.style.left=(Math.random()*100)+'vw';d.style.animationDuration=(8+Math.random()*10)+'s';
    d.style.animationDelay=(-Math.random()*12)+'s';document.body.appendChild(d);}

  const sigil=document.getElementById('sigil');
  const iris=document.getElementById('iris'),pupil=document.getElementById('pupil');
  const mouth=document.getElementById('mouth');
  const stage=document.getElementById('stage');

  // ---- physics state ----
  let pos={x: window.innerWidth/2, y: window.innerHeight*0.55};
  let vel={x:0,y:0};
  let grabbed=false, last={x:0,y:0,t:0}, vSamples=[];
  let idleFloat=0, lastPoke=0;

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

  // eye follows cursor (unless grabbed -> looks where thrown)
  addEventListener('mousemove',e=>{
    if(grabbed) return;
    const r=document.getElementById('eye').getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const dx=e.clientX-cx, dy=e.clientY-cy, d=Math.hypot(dx,dy)||1;
    const m=Math.min(d,22);
    iris.style.transform=`translate(calc(-50% + ${dx/d*m}px),calc(-50% + ${dy/d*m}px))`;
    pupil.style.transform=`translate(calc(-50% + ${dx/d*m*1.4}px),calc(-50% + ${dy/d*m*1.4}px))`;
  });
  setInterval(()=>{document.body.classList.add('blink');setTimeout(()=>document.body.classList.remove('blink'),130);},3200);

  // ---- interaction ----
  function toLocal(e){return {x:e.clientX, y:e.clientY};}
  function onDown(e){
    grabbed=true; document.body.classList.add('grabbing');
    const p=toLocal(e); last=p; vSamples=[]; vel={x:0,y:0};
    sigil.style.animation=''; // stop idle float while held
    e.preventDefault();
  }
  function onMove(e){
    if(!grabbed) return;
    const p=toLocal(e);
    const now=performance.now();
    pos.x=p.x; pos.y=p.y;
    const dt=Math.max(1, now-last.t);
    vSamples.push({x:(p.x-last.x)/dt, y:(p.y-last.y)/dt});
    if(vSamples.length>4) vSamples.shift();
    last=p; last.t=now;
    e.preventDefault();
  }
  function onUp(e){
    if(!grabbed) return;
    grabbed=false; document.body.classList.remove('grabbing');
    // fling velocity = avg recent sample (px/ms)
    if(vSamples.length){
      const a=vSamples.reduce((s,v)=>({x:s.x+v.x,y:s.y+v.y}),{x:0,y:0});
      vel.x=a.x/vSamples.length*16;  // -> px/frame (~60fps)
      vel.y=a.y/vSamples.length*16;
    }
    const speed=Math.hypot(vel.x,vel.y);
    if(speed>14){ // hard fling
      setMood('dizzy'); bump('fling', Math.round(speed));
    } else {
      setMood('happy');
    }
    e.preventDefault();
  }
  sigil.addEventListener('pointerdown',onDown);
  addEventListener('pointermove',onMove);
  addEventListener('pointerup',onUp);
  // tap = poke
  let downT=0;
  sigil.addEventListener('pointerdown',()=>downT=performance.now());
  sigil.addEventListener('pointerup',()=>{
    const dt=performance.now()-downT;
    if(dt<220 && Math.hypot(vel.x,vel.y)<3){ poke(); }
  });

  function poke(){
    const now=performance.now();
    if(now-lastPoke<250) return; lastPoke=now;
    sigil.classList.remove('hit'); void sigil.offsetWidth; sigil.classList.add('hit');
    setMood('angry');
    bump('poke', 1);
    setTimeout(()=>setMood('happy'),700);
  }

  function setMood(m){ document.body.setAttribute('data-mood', m); }

  // push interaction impulse to the loop (bridge WS :18765, else localStorage)
  let ws=null;
  try{ ws=new WebSocket('ws://127.0.0.1:18765'); }catch(e){ ws=null; }
  function bump(kind, power){
    const msg={type:'buddy_interaction', kind, power, ts:Date.now()};
    if(ws && ws.readyState===1){ ws.send(JSON.stringify(msg)); }
    try{ localStorage.setItem('buddy_interaction', JSON.stringify(msg)); }catch(e){}
    // also drop a file the loop can read
    try{
      fetch('buddy_interaction.json?cb='+Date.now(),{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify(msg)}).catch(()=>{});
    }catch(e){}
  }

  // ---- physics loop (Interactive Buddy: gravity + wall bounce) ----
  const GRAV=0.35, FRICT=0.985, BOUNCE=0.72;
  function step(){
    if(!grabbed){
      vel.y += GRAV;
      pos.x += vel.x; pos.y += vel.y;
      vel.x *= FRICT; vel.y *= FRICT;
      const W=window.innerWidth, H=window.innerHeight;
      if(pos.x<90){pos.x=90; vel.x=-vel.x*BOUNCE;} if(pos.x>W-90){pos.x=W-90; vel.x=-vel.x*BOUNCE;}
      if(pos.y<90){pos.y=90; vel.y=-vel.y*BOUNCE;} if(pos.y>H-90){pos.y=H-90; vel.y=-vel.y*BOUNCE; if(Math.abs(vel.y)<1)vel.y=0;}
      // if basically settled and not moving, gentle idle float
      if(Math.abs(vel.x)<0.2 && Math.abs(vel.y)<0.2){
        idleFloat += 0.02; pos.y += Math.sin(idleFloat)*0.3;
      } else { idleFloat=0; }
    }
    sigil.style.left=(pos.x-90)+'px';
    sigil.style.top=(pos.y-90)+'px';
    sigil.style.position='absolute';
    requestAnimationFrame(step);
  }
  // init position
  sigil.style.position='absolute';
  sigil.style.left=(pos.x-90)+'px'; sigil.style.top=(pos.y-90)+'px';
  step();

  // ---- state polling from loop ----
  async function tick(){
    try{
      const r=await fetch('face_state.json?cb='+Date.now());
      if(!r.ok)return;
      const s=await r.json();
      if(s.mood && !grabbed) document.body.setAttribute('data-mood',s.mood);
      if(s.mode) document.body.setAttribute('data-mode',s.mode);
      if(s.text) document.getElementById('ticker').textContent=s.text;
    }catch(e){}
    try{
      const rr=await fetch('rig_state.json?cb='+Date.now());
      if(rr.ok){const g=await rr.json();
        if(g.brain)document.getElementById('s_brain').textContent=g.brain;
        if(g.ethos)document.getElementById('s_ethos').textContent=g.ethos;}
    }catch(e){}
  }
  tick();setInterval(tick,1500);
</script>
</body>
</html>
