<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>WuBuDesk — entity</title>
<!-- SPDX-License-Identifier: WaefreBeorn-UMV3
     Boss 2026-08-04: "the orb sucks, make a full entity."

     So: an actual creature. Head, eyes with lids and pupils that track, a
     mouth that lip-syncs, ear-fins that flick, arms that swing with momentum,
     a tail that trails, and a body that squashes when it lands. Hand-built
     SVG + CSS transforms driven by one rAF loop -- no Live2D runtime, no
     three.js, no dependency, nothing to license. Runs in an OBS browser
     source at 1920x1080 with zero interaction required.

     It reads face_state.json (mood/text/heard/speaking) and stage.json
     (where the real OBS furniture is, so it never sits on chat).           -->
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:"Segoe UI",system-ui,sans-serif;user-select:none;cursor:default}
  #ent{position:absolute;width:230px;height:270px;left:60%;top:55%;
    will-change:transform;transform-origin:50% 92%}
  svg{overflow:visible;display:block}

  /* ---- bubble ---- */
  #bub{position:absolute;max-width:430px;padding:13px 17px;border-radius:16px;
    background:rgba(10,14,22,.93);color:#eaf6ff;font-size:20px;line-height:1.34;
    border:2px solid var(--gl,#49f0c0);opacity:0;transform:translateY(8px) scale(.97);
    transition:opacity .18s,transform .18s;pointer-events:none;
    box-shadow:0 8px 34px rgba(0,0,0,.55),0 0 22px var(--gl,#49f0c0)3a;
    text-shadow:0 1px 3px #000;z-index:5}
  #bub.on{opacity:1;transform:translateY(0) scale(1)}
  #bub:after{content:'';position:absolute;bottom:-11px;left:34px;width:0;height:0;
    border:11px solid transparent;border-top-color:rgba(10,14,22,.93);border-bottom:0}

  /* ---- what it heard ---- */
  #hrd{position:absolute;max-width:380px;padding:7px 12px;border-radius:11px;
    background:rgba(0,0,0,.5);color:#8fa6bb;font-size:14px;font-style:italic;
    opacity:0;transition:opacity .3s;pointer-events:none;z-index:4}
  #hrd.on{opacity:1}

  /* ---- name tag ---- */
  #tag{position:absolute;padding:3px 11px;border-radius:9px;font-size:12.5px;
    letter-spacing:2.4px;font-weight:700;color:#04121a;
    background:var(--gl,#49f0c0);opacity:.94;pointer-events:none;z-index:4;
    box-shadow:0 3px 14px rgba(0,0,0,.5)}
  /* cohost vital-signs HUD (subtle, bottom-left) */
  #stat{position:absolute;left:18px;bottom:18px;max-width:420px;padding:4px 10px;
    border-radius:8px;font-size:12px;font-family:"SF Mono",monospace;
    background:rgba(10,14,22,.6);color:#8fa6bb;opacity:0;
    transition:opacity .2s;pointer-events:none;z-index:4;
    box-shadow:0 2px 12px rgba(0,0,0,.4)}
  #stat.on{opacity:.82}

  .blink{animation:bl .16s ease}
  @keyframes bl{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.06)}}
</style>
</head>
<body>
<div id="bub"></div>
<div id="hrd"></div>
<div id="tag">WUBUDESK</div>
<div id="stat"></div>

<div id="ent">
<svg id="svg" width="230" height="270" viewBox="0 0 230 270">
  <defs>
    <radialGradient id="bodyG" cx="42%" cy="30%">
      <stop offset="0%"  stop-color="#2a5f72"/>
      <stop offset="55%" stop-color="#123243"/>
      <stop offset="100%" stop-color="#08161f"/>
    </radialGradient>
    <linearGradient id="finG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--gl,#49f0c0)" stop-opacity=".95"/>
      <stop offset="100%" stop-color="var(--gl,#49f0c0)" stop-opacity=".25"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse id="shadow" cx="115" cy="256" rx="54" ry="10"
           fill="#000" opacity=".34" filter="url(#soft)"/>

  <!-- tail: trails behind with lag -->
  <path id="tail" d="M115 210 Q 150 226 168 250" stroke="url(#finG)"
        stroke-width="9" fill="none" stroke-linecap="round" opacity=".85"/>

  <!-- BODY -->
  <g id="bodyG_">
    <!-- arms (behind torso) -->
    <g id="armL"><path d="M74 158 Q 52 176 48 198" stroke="#1b4557"
       stroke-width="15" fill="none" stroke-linecap="round"/>
       <circle cx="48" cy="200" r="10" fill="#236274"/></g>
    <g id="armR"><path d="M156 158 Q 178 176 182 198" stroke="#1b4557"
       stroke-width="15" fill="none" stroke-linecap="round"/>
       <circle cx="182" cy="200" r="10" fill="#236274"/></g>

    <!-- torso -->
    <path id="torso" d="M115 118 C 168 118 176 168 172 206
                        C 169 236 146 248 115 248
                        C 84 248 61 236 58 206
                        C 54 168 62 118 115 118Z"
          fill="url(#bodyG)" stroke="var(--gl,#49f0c0)" stroke-width="2.4"
          stroke-opacity=".55"/>
    <!-- chest sigil: the old orb, demoted to a heart -->
    <circle id="core" cx="115" cy="182" r="15" fill="var(--gl,#49f0c0)"
            opacity=".9" filter="url(#glow)"/>
    <circle cx="115" cy="182" r="26" fill="none" stroke="var(--gl,#49f0c0)"
            stroke-width="1.4" stroke-opacity=".4" stroke-dasharray="5 7">
      <animateTransform attributeName="transform" type="rotate"
        from="0 115 182" to="360 115 182" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HEAD -->
  <g id="head">
    <!-- ear fins -->
    <path id="finL" d="M62 74 Q 30 56 22 24 Q 54 34 70 58Z" fill="url(#finG)"/>
    <path id="finR" d="M168 74 Q 200 56 208 24 Q 176 34 160 58Z" fill="url(#finG)"/>

    <ellipse id="skull" cx="115" cy="82" rx="60" ry="54"
             fill="url(#bodyG)" stroke="var(--gl,#49f0c0)" stroke-width="2.6"
             stroke-opacity=".65"/>

    <!-- brow ridge, drops when angry -->
    <g id="brows" opacity="0">
      <path d="M78 52 L108 62" stroke="var(--gl,#49f0c0)" stroke-width="5"
            stroke-linecap="round"/>
      <path d="M152 52 L122 62" stroke="var(--gl,#49f0c0)" stroke-width="5"
            stroke-linecap="round"/>
    </g>

    <!-- eyes -->
    <g id="eyeL">
      <ellipse class="wht" cx="92" cy="80" rx="19" ry="21" fill="#04141b"/>
      <circle class="pup" cx="92" cy="80" r="10.5" fill="var(--gl,#49f0c0)"
              filter="url(#glow)"/>
      <circle class="shine" cx="88" cy="75" r="3.6" fill="#eaffff" opacity=".9"/>
      <ellipse class="lid" cx="92" cy="80" rx="20" ry="21" fill="#0d2733"
               style="transform-box:fill-box;transform-origin:50% 50%"/>
    </g>
    <g id="eyeR">
      <ellipse class="wht" cx="138" cy="80" rx="19" ry="21" fill="#04141b"/>
      <circle class="pup" cx="138" cy="80" r="10.5" fill="var(--gl,#49f0c0)"
              filter="url(#glow)"/>
      <circle class="shine" cx="134" cy="75" r="3.6" fill="#eaffff" opacity=".9"/>
      <ellipse class="lid" cx="138" cy="80" rx="20" ry="21" fill="#0d2733"
               style="transform-box:fill-box;transform-origin:50% 50%"/>
    </g>

    <!-- mouth: rx/ry driven by the lip-sync loop -->
    <ellipse id="mouth" cx="115" cy="116" rx="13" ry="3"
             fill="#03222c" stroke="var(--gl,#49f0c0)" stroke-width="2"/>
    <path id="smile" d="M100 114 Q 115 124 130 114" stroke="var(--gl,#49f0c0)"
          stroke-width="3" fill="none" stroke-linecap="round" opacity="0"/>
  </g>
</svg>
</div>

<script>
(()=>{
const ent=document.getElementById('ent'), svg=document.getElementById('svg');
const bub=document.getElementById('bub'), hrd=document.getElementById('hrd');
const tag=document.getElementById('tag'), head=document.getElementById('head');
const mouth=document.getElementById('mouth'), smile=document.getElementById('smile');
const brows=document.getElementById('brows'), tail=document.getElementById('tail');
const armL=document.getElementById('armL'), armR=document.getElementById('armR');
const finL=document.getElementById('finL'), finR=document.getElementById('finR');
const core=document.getElementById('core'), shadow=document.getElementById('shadow');
const statEl=document.getElementById('stat');
const lids=[...document.querySelectorAll('.lid')];
const pups=[...document.querySelectorAll('.pup')];
const shines=[...document.querySelectorAll('.shine')];
const eyes=[...document.querySelectorAll('.wht')];  // eye whites (for mood-based shape morph)
let e_mouseX=innerWidth/2,e_mouseY=innerHeight/2;
let _idle_px=0,_idle_py=0;

const MOOD={
  happy:  {gl:'#49f0c0',brow:0,  smile:1,pup:'#49f0c0',core:1,    eyeR:19,eyeRY:21},
  smug:   {gl:'#9be36a',brow:.35,smile:1,pup:'#9be36a',core:1,    eyeR:19,eyeRY:21},
  thinking:{gl:'#6fc3ff',brow:.2, smile:0,pup:'#6fc3ff',core:.6, eyeR:18,eyeRY:20},
  angry:  {gl:'#ff6b5e',brow:1,  smile:0,pup:'#ff6b5e',core:1.4, eyeR:17,eyeRY:22},
  dizzy:  {gl:'#ffd45e',brow:0,  smile:0,pup:'#ffd45e',core:.8, eyeR:18,eyeRY:21},
  bored:  {gl:'#8fa6bb',brow:.15,smile:0,pup:'#8fa6bb',core:.5, eyeR:18,eyeRY:20},
  sad:    {gl:'#7f8fe0',brow:.5, smile:0,pup:'#7f8fe0',core:.4, eyeR:20,eyeRY:18},
  excited:{gl:'#ff6b9d',brow:0,  smile:1,pup:'#ff6b9d',core:1.6, eyeR:20,eyeRY:22},
  confused:{gl:'#c4b5ff',brow:.3, smile:0,pup:'#c4b5ff',core:.7, eyeR:19,eyeRY:21},
  mischievous:{gl:'#ff8f50',brow:.2,smile:.5,pup:'#ff8f50',core:1.2, eyeR:20,eyeRY:21},
  tired:{gl:'#a0a0a0',brow:.1, smile:0,pup:'#a0a0a0',core:.3,   eyeR:20,eyeRY:16}
};
let mood='happy',_targetGl='#49f0c0';
function setMood(m){
  const c=MOOD[m]||MOOD.happy; mood=m;
  _targetGl=c.gl;
  // smooth color transition (interpolated over ~300ms)
  const t=document.documentElement.style;
  t.setProperty('--gl-to',c.gl);
  t.setProperty('--gl',c.gl);
  brows.style.opacity=c.brow;
  smile.style.opacity=c.smile;
  // pupil color per mood
  pups.forEach(p=>p.setAttribute('fill',c.pup));
  tag.style.background=c.gl;
  // core pulse intensity per mood
  _corePulse=c.core;
  // Eye shape morphs per mood (wider when excited, narrow when tired)
  eyes.forEach(e=>{
    e.setAttribute('rx',c.eyeR);
    e.setAttribute('ry',c.eyeRY);
  });
}
setMood('happy');

// ---------- physics (spring-based, per Josh Womack) ----------
// Position uses velocity-Verlet integration with spring-damper for natural
// overshoot/settling. Mass, stiffness, and damping give organic motion.
const pos={x:innerWidth*.62,y:innerHeight*.5}, vel={x:0,y:0};
let grabbed=false,gx=0,gy=0,lastPtr={x:0,y:0,t:0},idle=0,land=0;
let tailLag={x:pos.x,y:pos.y}, headLag=0;

// Spring parameters: stiffness (higher=snappier), damping (higher=less bounce)
const SPRING_K=0.12, SPRING_D=0.82, GRAVITY=0.36;

function spring(target, current, velocity, k=SPRING_K, d=SPRING_D) {
    // Classical spring-damper: F = -k * (x - target) - d * v
    const force = -k * (current - target);
    const damp = -d * velocity;
    const accel = force + damp;
    return velocity + accel;
}

svg.addEventListener('pointerdown',e=>{
  grabbed=true;gx=e.clientX-pos.x;gy=e.clientY-pos.y;
  lastPtr={x:e.clientX,y:e.clientY,t:performance.now()};
  svg.setPointerCapture(e.pointerId);
  send({kind:'grab'});
});
addEventListener('pointermove',e=>{
  if(!grabbed)return;
  pos.x=e.clientX-gx;pos.y=e.clientY-gy;
  const dt=Math.max(1,performance.now()-lastPtr.t);
  vel.x=(e.clientX-lastPtr.x)/dt*15; vel.y=(e.clientY-lastPtr.y)/dt*15;
  lastPtr={x:e.clientX,y:e.clientY,t:performance.now()};
});
addEventListener('pointerup',()=>{
  if(!grabbed)return; grabbed=false;
  const p=Math.round(Math.hypot(vel.x,vel.y));
  if(p>14){setMood('dizzy');send({kind:'fling',power:p});}
});
svg.addEventListener('click',e=>{
  if(Math.hypot(vel.x,vel.y)>6)return;
  setMood('angry');vel.y-=7;vel.x+=(Math.random()-.5)*8;
  send({kind:'poke'});
});
function send(m){
  fetch('/buddy',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(m)}).catch(()=>{});
}

// ---------- cursor tracking (for eye/head following) ----------
addEventListener('mousemove',e=>{
  e_mouseX=e.clientX; e_mouseY=e.clientY;
});

// ---------- stage awareness ----------
let zones=[],cw=1920,ch=1080;
async function stage(){try{
  const r=await fetch('stage.json?c='+Date.now()); if(!r.ok)return;
  const s=await r.json(); zones=s.zones||[];
  if(s.canvas){cw=s.canvas.w;ch=s.canvas.h;}
}catch(e){}}
stage();setInterval(stage,5000);
const sx=v=>v*innerWidth/cw, sy=v=>v*innerHeight/ch;
function avoid(){
  const R=120;
  for(const z of zones){
    const x1=sx(z.x),y1=sy(z.y),x2=sx(z.x+z.w),y2=sy(z.y+z.h);
    if(pos.x+R>x1&&pos.x-R<x2&&pos.y+R>y1&&pos.y-R<y2){
      const dl=pos.x-x1,dr=x2-pos.x,dt=pos.y-y1,db=y2-pos.y;
      const m=Math.min(Math.abs(dl),Math.abs(dr),Math.abs(dt),Math.abs(db));
      if(m===Math.abs(dl)){pos.x=x1-R;vel.x=-Math.abs(vel.x)*.5-.7;}
      else if(m===Math.abs(dr)){pos.x=x2+R;vel.x=Math.abs(vel.x)*.5+.7;}
      else if(m===Math.abs(dt)){pos.y=y1-R;vel.y=-Math.abs(vel.y)*.5-.7;}
      else{pos.y=y2+R;vel.y=Math.abs(vel.y)*.5+.7;}
    }
  }
}

// ---------- blinking ----------
function blink(){
  lids.forEach(l=>{l.classList.remove('blink');void l.offsetWidth;l.classList.add('blink');});
  setTimeout(blink,1600+Math.random()*4200);
}
lids.forEach(l=>l.style.transformOrigin='center');
setTimeout(blink,900);

// ---------- speech / lip-sync ----------
// viseme shapes: A(open), E(mid), I(small), O(round), U(neutral)
// driven by amplitude envelope. face_state.json can supply explicit
// visemes as a string (e.g. "AAIEOU") for precise sync from speech engine.
let speaking=false,mouthT=0,talkUntil=0,visemes="";
const VISAME_DURATION=160; let viseme_pos=0,viseme_t=0,_corePulse=1;
const MOUTH_OPEN=[2,5,8,11,9,6]; // A,E,I,O,U,close -> ry values
function lipsync(dt){
  if(speaking||performance.now()<talkUntil){
    if(visemes){
      viseme_t+=dt;
      while(viseme_t>=VISAME_DURATION && viseme_pos<visemes.length-1){
        viseme_pos++; viseme_t-=VISAME_DURATION;
      }
      const idx="AEIOU".indexOf(visemes[viseme_pos]||'A');
      const ry=MOUTH_OPEN[idx>=0?idx:5];
      mouth.setAttribute('ry',ry);
      mouth.setAttribute('rx',13);
    }else{
      mouthT+=dt*0.019;
      const open=3+Math.abs(Math.sin(mouthT))*11+Math.sin(mouthT*2.7)*3;
      mouth.setAttribute('ry',Math.max(2,open).toFixed(1));
      mouth.setAttribute('rx',(13+Math.sin(mouthT*1.3)*3).toFixed(1));
    }
  }else{
    viseme_pos=0;viseme_t=0;
    const ry=+mouth.getAttribute('ry');
    mouth.setAttribute('ry',Math.max(3,ry*0.82).toFixed(1));
  }
}

// ---------- main loop ----------
const G=GRAVITY,F=.986,B=.7;
let prev=performance.now();
function frame(now){
  const dt=Math.min(48,now-prev); prev=now;
  if(!grabbed){
    vel.y+=G;
    // Spring-damper for natural horizontal settle (Josh Womack method)
    vel.x = spring(0, pos.x, vel.x, 0.08, 0.88);
    pos.x+=vel.x;pos.y+=vel.y;
    // light damping
    vel.x*=F;vel.y*=F;
    const W=innerWidth,H=innerHeight;
    if(pos.x<125){pos.x=125;vel.x=-vel.x*B;}
    if(pos.x>W-125){pos.x=W-125;vel.x=-vel.x*B;}
    if(pos.y<150){pos.y=150;vel.y=-vel.y*B;}
    if(pos.y>H-150){
      if(vel.y>2.4)land=Math.min(1,vel.y/16);
      pos.y=H-150;vel.y=-vel.y*B; if(Math.abs(vel.y)<1)vel.y=0;
    }
    avoid();
    if(Math.abs(vel.x)<.2&&Math.abs(vel.y)<.2){
      idle+=.021;pos.y+=Math.sin(idle)*.34;
      // subtle eye drift when idle (looks around)
      _idle_px=Math.sin(idle*.3)*2; _idle_py=Math.cos(idle*.2)*1;
      // breathing cycle: subtle scale oscillation
      const breath=Math.sin(idle*.8)*0.008;
      ent.style.transform=`rotate(${lean.toFixed(1)}deg) scale(${st.toFixed(3)},${sq.toFixed(3)})`;
      // mood-specific idle micro-animations
      if(mood==='excited' && Math.random()<.004) vel.x+=(Math.random()-.5)*8;
      if(mood==='bored' && Math.random()<.0008) vel.y-=.5; // slump
      if(mood==='sad' && Math.random()<.002) _idle_py+=.3; // heavier gaze
      if(Math.random()<.0016){vel.x=(Math.random()-.5)*10;vel.y=-5-Math.random()*4;}
    }else idle=0;
  }
  land*=.9;

  // squash & stretch
  const sq=1+land*.34, st=1-land*.24;
  const lean=Math.max(-15,Math.min(15,vel.x*1.5));
  ent.style.left=(pos.x-115)+'px';
  ent.style.top=(pos.y-135)+'px';
  ent.style.transform=`rotate(${lean.toFixed(1)}deg) scale(${st.toFixed(3)},${sq.toFixed(3)})`;

  // head lags the body -> feels alive
  headLag+=((-lean*0.55)-headLag)*0.12;
  // head turns toward cursor when idle (subtle interest)
  const headDist=Math.hypot(pos.x+115-e_mouseX, pos.y+90-e_mouseY);
  if(!grabbed && idle>0 && headDist<innerWidth*.4){
    headLag+=(((e_mouseX||innerWidth/2)-(pos.x+115))*0.002-headLag)*0.12;
  }
  head.setAttribute('transform',
    `rotate(${headLag.toFixed(2)} 115 90) translate(0 ${(Math.sin(idle*1.3)*1.6).toFixed(2)})`);

  // eyes track motion + cursor (look where you're going / what's grabbed)
  const mx=(e_mouseX||innerWidth/2)-pos.x-115;
  const my=(e_mouseY||innerHeight/2)-pos.y-90;
  const px=Math.max(-6,Math.min(6,vel.x*.9+mx*0.01+_idle_px));
  const py=Math.max(-5,Math.min(5,vel.y*.6+my*0.01+_idle_py));
  pups.forEach((p,i)=>{p.setAttribute('cx',(i?138:92)+px);p.setAttribute('cy',80+py);});
  shines.forEach((s,i)=>{s.setAttribute('cx',(i?134:88)+px*.8);s.setAttribute('cy',75+py*.8);});

  // arms swing with momentum
  const sw=Math.max(-26,Math.min(26,-vel.x*2.2))+Math.sin(idle*1.1)*4;
  armL.setAttribute('transform',`rotate(${sw.toFixed(1)} 74 158)`);
  armR.setAttribute('transform',`rotate(${sw.toFixed(1)} 156 158)`);

  // fins flick
  const fk=Math.sin(now*.0035)*7+Math.max(-14,Math.min(14,vel.x*1.4));
  finL.setAttribute('transform',`rotate(${(-fk).toFixed(1)} 62 74)`);
  finR.setAttribute('transform',`rotate(${fk.toFixed(1)} 168 74)`);

  // tail trails
  tailLag.x+=((pos.x)-tailLag.x)*.12; tailLag.y+=((pos.y)-tailLag.y)*.1;
  const tdx=Math.max(-42,Math.min(42,(tailLag.x-pos.x)*1.7));
  const tdy=Math.max(-16,Math.min(28,(tailLag.y-pos.y)*1.1));
  tail.setAttribute('d',`M115 210 Q ${150+tdx} ${226+tdy} ${168+tdx*1.5} ${250+tdy}`);

  // core pulse (intensity varies per mood)
  const pulsePhase = now * .004;
  let coreR = 15+Math.sin(pulsePhase)*1.9*_corePulse;
  if(speaking) coreR += 2.4;
  // dizzy: core spins + wobbles
  if(mood==='dizzy') {
    coreR *= 0.9 + Math.sin(now*.015)*0.2;
    core.setAttribute('transform', `rotate(${(now*.4%360).toFixed(1)} 115 182)`);
  } else {
    core.setAttribute('transform', '');
  }
  core.setAttribute('r', coreR.toFixed(2));
  shadow.setAttribute('rx',(54*st).toFixed(1));
  shadow.setAttribute('opacity',(0.34*(1-Math.min(.6,(innerHeight-150-pos.y)/700))).toFixed(2));

  lipsync(dt);

  // bubbles ride along
  bub.style.left=Math.min(innerWidth-450,Math.max(10,pos.x-60))+'px';
  bub.style.top=Math.max(8,pos.y-140-bub.offsetHeight-14)+'px';
  hrd.style.left=Math.min(innerWidth-400,Math.max(10,pos.x-50))+'px';
  hrd.style.top=(pos.y+140)+'px';
  tag.style.left=(pos.x-42)+'px'; tag.style.top=(pos.y+118)+'px';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- state polling (with WebSocket push) ----------
let lastTxt='',lastHeard='';
// WebSocket: server pushes face_state.json changes instead of polling
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') +
               location.hostname + ':8138/state/';
let ws = null;
function initWS() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => console.log('[overlay] ws connected');
    ws.onmessage = (ev) => {
        try { applyState(JSON.parse(ev.data)); } catch(e) {}
    };
    ws.onclose = () => { setTimeout(initWS, 2000); };  // reconnect
    ws.onerror = () => { ws.close(); };
}
// Try WebSocket first; fall back to polling if it fails
let wsReady = false;
setTimeout(() => {
    if (ws && ws.readyState === WebSocket.OPEN) wsReady = true;
}, 1000);
initWS();
// Polling fallback (reduced frequency since WS handles real-time)
setInterval(() => {
    if (!wsReady) poll();
}, 1200);

// Extract state processing so both WS and polling share the same logic
function applyState(s){
  if(s.mood&&s.mood!==mood)setMood(s.mood);
  speaking=!!s.speaking;
  const t=(s.text||'').trim();
  if(t!==lastTxt){
    lastTxt=t;
    if(t){bub.textContent=t;bub.classList.add('on');
          talkUntil=performance.now()+Math.min(9000,1100+t.length*52);}
    else bub.classList.remove('on');
  }
  const h=(s.heard||'').trim();
  if(h!==lastHeard){
    lastHeard=h;
    if(h){hrd.textContent='"'+h+'"';hrd.classList.add('on');}
    else hrd.classList.remove('on');
  }
  // --- viseme string for precise lip-sync (from speech engine) ---
  if(s.visemes && s.visemes!==visemes){
    visemes=s.visemes; viseme_pos=0; viseme_t=0;
  }
  // --- cohost vital signs (transparency: let the stream see it think) ---
  if(s.status && statEl){
    const st=s.status;
    statEl.textContent=[
      st.voice ? `voice:${st.voice}` : '',
      st.cuda ? `gpu:${st.cuda}` : '',
      st.lessons!=null ? `lessons:${st.lessons}` : '',
      st.rps ? `${st.rps}ms` : ''
    ].filter(Boolean).join('  ');
    statEl.classList.toggle('on', Boolean(st.voice||st.cuda||st.lessons!=null));
  }
}

async function poll(){
  try{
    const r=await fetch('face_state.json?c='+Date.now()); if(!r.ok)return;
    applyState(await r.json());
  }catch(e){}
}
poll();setInterval(poll,1200);  // reduced poll rate (WS handles real-time)
})();
</script>
