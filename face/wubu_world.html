<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>WuBu World — cohost body / world-space engine (Box3D + Box2D)</title>
<!--
  WuBuPet World Engine — the cohost's BODY (v2, research-upgraded 2026-08-04).
  Upgrades from research:
   - Paper-Mario flip = real camera-orbit (rotateX 90deg) + paper-turn squash (xscale sweep)
   - Poincaré disk: geodesic lines between spawned props (manifold DISTANCE made visible)
   - Box3D-style physics: 3D props get gravity + floor bounce (tiny JS integrator
     mirroring Box3D's b3World step; native C shim lives in wubu_world.c)
   - more fx: confetti on flip, "flat only" gag (3D props vanish when flattened)
  No external libs. Self-contained. OBS browser-source safe.
  SPDX-License-Identifier: WaefreBeorn-UMV3
-->
<style>
  :root{ --mood:#39e6c8; --accent:#ff5cc8; --mood2:#9cf; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;
    font-family:"Segoe UI",system-ui,sans-serif;color:#cfe}
  #stage{position:fixed;inset:0;perspective:1300px}
  /* ===== Box3D volume world (perspective, depth) ===== */
  #world{position:absolute;left:50%;top:56%;width:440px;height:440px;
    transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(0deg) rotateZ(0deg);
    transition:transform 1.0s cubic-bezier(.2,.85,.25,1)}
  .face{position:absolute;width:440px;height:440px;border:2px solid var(--mood);
    background:radial-gradient(circle at 50% 40%, rgba(57,230,200,.10), rgba(10,20,30,.30));
    box-shadow:inset 0 0 60px rgba(57,230,200,.25)}
  .f1{transform:translateZ(220px)} .f2{transform:rotateY(90deg) translateZ(220px)}
  .f3{transform:rotateY(180deg) translateZ(220px)} .f4{transform:rotateY(-90deg) translateZ(220px)}
  .f5{transform:rotateX(90deg) translateZ(220px)} .f6{transform:rotateX(-90deg) translateZ(220px)}
  .floor{position:absolute;width:440px;height:440px;left:0;top:0;
    background:repeating-linear-gradient(45deg, rgba(57,230,200,.06) 0 14px, transparent 14px 28px);
    border:1px dashed rgba(57,230,200,.3);transform:rotateX(90deg) translateZ(-220px)}
  /* ===== Box2D flat plane (isometric paper) ===== */
  #plane2d{position:absolute;left:50%;top:56%;width:540px;height:300px;
    transform:translate(-50%,-50%) rotateX(0deg);transition:opacity .6s,transform 1.0s;
    border:2px solid var(--accent);border-radius:10px;
    background:linear-gradient(180deg, rgba(255,92,200,.08), rgba(20,10,30,.42));
    box-shadow:0 0 40px rgba(255,92,200,.22);display:flex;align-items:center;justify-content:center}
  .lbl{position:absolute;top:6px;left:10px;font-size:12px;letter-spacing:2px;opacity:.8}
  #world .lbl{color:var(--mood)} #plane2d .lbl{color:var(--accent)}
  .props{position:relative;width:100%;height:100%}
  /* ===== spawned props ===== */
  .prop{position:absolute;font-size:34px;line-height:1;user-select:none;
    transition:opacity .6s, transform .35s;animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .prop.flat{color:var(--accent);filter:drop-shadow(0 0 6px rgba(255,92,200,.7))}
  .prop.vol{color:var(--mood);filter:drop-shadow(0 0 10px rgba(57,230,200,.7))}
  .prop.dying{opacity:0;transform:scale(.2) rotate(60deg)}
  /* ===== cohost body ===== */
  #body{position:absolute;left:50%;top:11%;transform:translateX(-50%);
    width:170px;height:215px;transition:transform .5s}
  .hat{width:0;height:0;margin:0 auto;border-left:58px solid transparent;
    border-right:58px solid transparent;border-bottom:84px solid #2a1d5e;position:relative;
    filter:drop-shadow(0 0 10px var(--mood))}
  .hat:after{content:"W";position:absolute;left:-9px;top:44px;color:var(--mood);font-weight:700}
  .eye{width:128px;height:64px;margin:8px auto 0;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #0a2, #031 80%);border:3px solid var(--mood);
    overflow:hidden;position:relative;box-shadow:0 0 24px var(--mood)}
  .pupil{position:absolute;width:24px;height:24px;border-radius:50%;background:#bff;
    left:50%;top:50%;transform:translate(-50%,-50%);transition:left .08s,top .08s;
    box-shadow:0 0 12px #fff}
  .mouth{width:74px;height:10px;margin:12px auto 0;border-radius:0 0 40px 40px;
    background:var(--accent);transition:height .06s;box-shadow:0 0 14px var(--accent)}
  /* ===== Poincaré manifold ===== */
  #manifold{position:absolute;right:16px;bottom:16px;width:250px;height:250px;
    border-radius:50%;border:1px solid rgba(57,230,200,.4);
    background:radial-gradient(circle at 50% 50%, rgba(10,30,40,.5), rgba(2,6,10,.7));
    box-shadow:0 0 30px rgba(57,230,200,.18)}
  #manifold canvas{width:100%;height:100%;border-radius:50%}
  #manifold .cap{position:absolute;top:-18px;left:0;font-size:11px;color:var(--mood);opacity:.7;letter-spacing:1px}
  /* ===== HUD + fx ===== */
  #hud{position:absolute;left:14px;top:12px;font-size:12px;line-height:1.55;opacity:.78;text-shadow:0 0 6px #000}
  #hud b{color:var(--mood)}
  #fx{position:absolute;inset:0;pointer-events:none}
  .spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;
    box-shadow:0 0 8px var(--mood);animation:fade 1.4s linear forwards}
  @keyframes fade{to{opacity:0;transform:translateY(-34px) scale(.4)}}
  .confetti{position:absolute;width:7px;height:7px;opacity:.9;animation:conf 1.6s ease-out forwards}
  @keyframes conf{to{transform:translateY(120px) rotate(540deg);opacity:0}}
  #movie .hat{filter:drop-shadow(0 0 14px #ffcf6a)}
  #movie .eye{border-color:#ffcf6a;box-shadow:0 0 24px #ffcf6a}
  #narration{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    font-size:13px;color:var(--mood2);opacity:.85;text-align:center;max-width:70%;
    text-shadow:0 0 8px #000}
</style>
</head>
<body>
<div id="stage">
  <div id="body">
    <div class="hat"></div>
    <div class="eye"><div class="pupil" id="pupil"></div></div>
    <div class="mouth" id="mouth"></div>
  </div>

  <div id="world"><span class="lbl">BOX3D · volume</span>
    <div class="face f1"></div><div class="face f2"></div><div class="face f3"></div>
    <div class="face f4"></div><div class="face f5"></div><div class="face f6"></div>
    <div class="floor"></div>
    <div class="props" id="props3d"></div>
  </div>

  <div id="plane2d"><span class="lbl">BOX2D · flat plane (paper)</span>
    <div class="props" id="props2d"></div>
  </div>

  <div id="manifold"><span class="cap">POINCARÉ DISK · the manifold</span>
    <canvas id="mcanvas" width="250" height="250"></canvas>
  </div>

  <div id="hud">
    <div><b>WuBu World</b> — cohost body v2</div>
    <div>dim: <span id="dim">3D · Box3D</span> · props: <span id="pcount">0</span></div>
    <div>mood: <span id="moodtxt">happy</span></div>
    <div style="opacity:.6">F flip · 2/3 force · A 2D · D 3D · C clear</div>
  </div>
  <div id="narration"></div>
  <div id="fx"></div>
</div>

<script>
/* ============== state ============== */
const S = { dim:'3d', mood:'happy', speaking:false, props:[], manifoldPts:[] };
const FLAT = ['▭','◻','▤','❏','□','▢','▼','◆'];   // exist ONLY on the flat plane
const VOL  = ['◉','⬢','★','⬟','❂','●','⬣','✦'];   // need VOLUME; vanish if flattened

/* ============== OBS bridge: read face_state.json ============== */
async function pollState(){
  try{
    const r = await fetch('face_state.json?t='+Date.now());
    if(r.ok){ const j = await r.json();
      if(j.mood) setMood(j.mood);
      if(j.speaking!==undefined) setSpeaking(j.speaking);
      if(j.text) setNarration(j.text);
    }
  }catch(e){}
  setTimeout(pollState, 800);
}
pollState();

/* ============== dimension flip (Paper-Mario: camera orbit + paper turn) ============== */
let flipping=false;
function flipDim(to){
  if(flipping) return; flipping=true;
  S.dim = to || (S.dim==='3d' ? '2d' : '3d');
  const world=document.getElementById('world'), plane=document.getElementById('plane2d');
  const dimTxt=document.getElementById('dim');
  if(S.dim==='3d'){
    world.style.transform='translate(-50%,-50%) rotateX(0deg) rotateZ(0deg)';
    world.style.opacity=1; plane.style.opacity=0;
    dimTxt.textContent='3D · Box3D';
    paperTurn(world);
  } else {
    // flatten: rotate camera 90deg to isometric, squash the volume away
    world.style.transform='translate(-50%,-50%) rotateX(90deg) scale(.35)';
    world.style.opacity=0; plane.style.opacity=1;
    dimTxt.textContent='2D · Box2D (paper)';
    paperTurn(plane);
    // GAG: 3D-only props can't live in 2D — they "fall out"
    S.props.forEach(p=>{ if(p.kind==='vol'){ p.el.style.transform='translateY(60px) scale(.2)'; setTimeout(()=>p.el.style.opacity=0.05,200); } });
  }
  // re-show the props that belong to the current dimension
  S.props.forEach(p=>{
    const vis = (p.kind==='vol') ? S.dim==='3d' : S.dim==='2d';
    if(vis){ p.el.style.opacity=1; p.el.style.transform=''; }
  });
  confettiBurst();
  setTimeout(()=>flipping=false, 1050);
}
function paperTurn(el){ // squash-x sweep for the "paper flip" comedy
  el.animate([{transform:el.style.transform+' scaleX(1)'},
              {transform:el.style.transform+' scaleX(0.02)'},
              {transform:el.style.transform+' scaleX(1)'}],
             {duration:1000, easing:'ease-in-out'});
}

/* ============== spawn props (Box3D volume vs Box2D plane) ============== */
function spawnProp(kind){
  const el=document.createElement('div');
  el.className='prop '+(kind==='flat'?'flat':'vol');
  el.textContent = kind==='flat' ? FLAT[Math.random()*FLAT.length|0] : VOL[Math.random()*VOL.length|0];
  const host = kind==='flat'?document.getElementById('props2d'):document.getElementById('props3d');
  el.style.left=(8+Math.random()*78)+'%'; el.style.top=(12+Math.random()*64)+'%';
  const vis=(kind==='flat'&&S.dim==='2d')||(kind==='vol'&&S.dim==='3d');
  el.style.opacity=vis?1:0.05;
  host.appendChild(el);
  // Box3D-style physics: 3D props get a gravity integrator (bounce on floor)
  let phys=null;
  if(kind==='vol'){ phys={y:Math.random()*120, vy:0, floor:200-Math.random()*40}; }
  // manifold point
  const ang=Math.random()*Math.PI*2, r=0.12+Math.random()*0.8;
  const mp=[Math.cos(ang)*r, Math.sin(ang)*r];
  S.manifoldPts.push(mp);
  S.props.push({el,kind,host,phys,manifold:mp});
  document.getElementById('pcount').textContent=S.props.length;
  drawManifold();
  if(S.props.length>40) removeProp(S.props[0]);
}
function removeProp(p){
  p.el.classList.add('dying'); setTimeout(()=>p.el.remove(),600);
  S.props=S.props.filter(x=>x!==p);
  S.manifoldPts=S.manifoldPts.filter(x=>x!==p.manifold);
  drawManifold(); document.getElementById('pcount').textContent=S.props.length;
}
/* tiny Box3D-mirroring integrator for 3D props (gravity + floor bounce) */
function stepPhysics(){
  for(const p of S.props){
    if(p.kind!=='vol'||!p.phys||S.dim!=='3d') continue;
    p.phys.vy+=0.6; p.phys.y+=p.phys.vy;
    if(p.phys.y>p.phys.floor){ p.phys.y=p.phys.floor; p.phys.vy*=-0.55; }
    p.el.style.transform=`translateY(${p.phys.y}px)`;
  }
  requestAnimationFrame(stepPhysics);
}
stepPhysics();

/* ============== Poincaré disk manifold (geodesics between props) ============== */
const mc=document.getElementById('mcanvas'), mctx=mc.getContext('2d');
const CX=125,CY=125,R=112;
function P2px(p){ return [CX+p[0]*R, CY-p[1]*R]; }
function poincareDist(a,b){ // true hyperbolic distance on the disk
  const na=Math.hypot(a[0],a[1]), nb=Math.hypot(b[0],b[1]);
  const d2=(a[0]-b[0])**2+(a[1]-b[1])**2;
  return Math.acosh(1+2*d2/((1-na*na)*(1-nb*nb)));
}
function drawManifold(){
  mctx.clearRect(0,0,250,250);
  for(let i=1;i<=4;i++){ mctx.beginPath(); mctx.arc(CX,CY,i/4*R,0,Math.PI*2);
    mctx.strokeStyle='rgba(57,230,200,'+(0.08+0.05*i)+')'; mctx.stroke(); }
  mctx.beginPath(); mctx.arc(CX,CY,R,0,Math.PI*2); mctx.strokeStyle='rgba(57,230,200,.5)'; mctx.stroke();
  // geodesic lines between consecutive props (manifold STRUCTURE)
  mctx.strokeStyle='rgba(159,204,255,.35)'; mctx.lineWidth=1;
  for(let i=1;i<S.manifoldPts.length;i++){
    const [x1,y1]=P2px(S.manifoldPts[i-1]), [x2,y2]=P2px(S.manifoldPts[i]);
    mctx.beginPath(); mctx.moveTo(x1,y1); mctx.lineTo(x2,y2); mctx.stroke();
  }
  S.manifoldPts.forEach(p=>{ const [x,y]=P2px(p); mctx.beginPath(); mctx.arc(x,y,3,0,Math.PI*2);
    mctx.fillStyle=(Math.hypot(p[0],p[1])>0.7)?'#ff5cc8':'#39e6c8'; mctx.fill(); });
}

/* ============== eye + mouth (reuse cohost_line.wav) ============== */
const pupil=document.getElementById('pupil'), mouth=document.getElementById('mouth');
document.addEventListener('mousemove',e=>{
  const r=document.getElementById('body').getBoundingClientRect();
  const dx=(e.clientX-(r.left+r.width/2))/window.innerWidth, dy=(e.clientY-(r.top+r.height/2))/window.innerHeight;
  pupil.style.left=(50+dx*40)+'%'; pupil.style.top=(50+dy*40)+'%';
});
let mRAF=null;
function animateMouth(){
  try{
    const ctxA=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctxA.createMediaElementSource(new Audio('cohost_line.wav'));
    const an=ctxA.createAnalyser(); src.connect(an); an.connect(ctxA.destination);
    const buf=new Uint8Array(an.frequencyBinCount);
    (function loop(){ an.getByteTimeDomainData(buf); let pk=0;
      for(let i=0;i<buf.length;i++){const v=Math.abs(buf[i]-128); if(v>pk)pk=v;}
      mouth.style.height=(8+pk/128*26)+'px'; mRAF=requestAnimationFrame(loop); })();
  }catch(e){}
}
function setSpeaking(v){ if(v===S.speaking)return; S.speaking=v;
  if(v&&!mRAF)animateMouth(); if(!v&&mRAF){cancelAnimationFrame(mRAF);mRAF=null;mouth.style.height='10px';} }
function setMood(m){ S.mood=m; document.getElementById('moodtxt').textContent=m;
  const c=m==='happy'?'#39e6c8':m==='movie'?'#ffcf6a':m==='alert'?'#ff5cc8':'#9cf';
  document.documentElement.style.setProperty('--mood',c); }
function setNarration(t){ document.getElementById('narration').textContent=t||''; }

/* ============== fx ============== */
const fx=document.getElementById('fx');
function spark(n){ for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='spark';
  s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*100)+'%';
  fx.appendChild(s); setTimeout(()=>s.remove(),1400); } }
function confettiBurst(){ const cols=['#39e6c8','#ff5cc8','#9cf','#ffcf6a'];
  for(let i=0;i<40;i++){ const c=document.createElement('div'); c.className='confetti';
    c.style.left=(40+Math.random()*20)+'%'; c.style.top='40%';
    c.style.background=cols[i%cols.length];
    fx.appendChild(c); setTimeout(()=>c.remove(),1600); } }

/* ============== controls ============== */
window.addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F')flipDim();
  if(e.key==='3')flipDim('3d'); if(e.key==='2')flipDim('2d');
  if(e.key==='a'||e.key==='A')spawnProp('flat');
  if(e.key==='d'||e.key==='D')spawnProp('vol');
  if(e.key==='c'||e.key==='C')S.props.slice().forEach(removeProp);
});
window.__wubu_world={ flip:flipDim, spawn2D:()=>spawnProp('flat'), spawn3D:()=>spawnProp('vol'),
  clear:()=>S.props.slice().forEach(removeProp), setMood, setNarration };

/* ============== idle demo ============== */
let t=0; setInterval(()=>{
  if(S.props.length<6) spawnProp(Math.random()<0.5?'flat':'vol');
  if(t++%6===0) spark(16);
},2600);

flipDim('3d');
for(let i=0;i<4;i++) spawnProp(i%2?'flat':'vol');
drawManifold();
</script>
</body>
</html>
