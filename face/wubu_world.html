<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>WuBu World — cohost body / world-space engine</title>
<!--
  WuBuPet World Engine — the cohost's BODY.
  A browser-source overlay (serve on :8137 alongside face/index.html).
  - Box2D-style flat plane (2D-only props) vs Box3D-style volume (3D-only props)
  - "Dimension flip" = Paper-Mario toggle between the two (the joke)
  - Poincare disk manifold: spawn markers to EXPLAIN the manifold visually
  - particle FX, mood glow, the all-seeing eye + WebAudio mouth (reuse cohost_line.wav)
  No external libs. Self-contained. OBS-safe.
  SPDX-License-Identifier: WaefreBeorn-UMV3
-->
<style>
  :root{ --mood:#39e6c8; --accent:#ff5cc8; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;
    font-family:"Segoe UI",system-ui,sans-serif;color:#cfe}
  #stage{position:fixed;inset:0;perspective:1200px}
  /* ---- the world box (Box3D volume metaphor) ---- */
  #world{position:absolute;left:50%;top:54%;width:460px;height:460px;
    transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(58deg) rotateZ(0deg);
    transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
  .face{position:absolute;width:460px;height:460px;border:2px solid var(--mood);
    background:radial-gradient(circle at 50% 40%, rgba(57,230,200,.10), rgba(10,20,30,.35));
    box-shadow:inset 0 0 60px rgba(57,230,200,.25)}
  .f1{transform:translateZ(230px)} .f2{transform:rotateY(90deg) translateZ(230px)}
  .f3{transform:rotateY(180deg) translateZ(230px)} .f4{transform:rotateY(-90deg) translateZ(230px)}
  .f5{transform:rotateX(90deg) translateZ(230px)} .f6{transform:rotateX(-90deg) translateZ(230px)}
  /* ---- the 2D plane (Box2D metaphor): flat, paper-mario card ---- */
  #plane2d{position:absolute;left:50%;top:54%;width:520px;height:320px;
    transform:translate(-50%,-50%) rotateX(0deg);transition:opacity .6s,transform 1.1s;
    border:2px solid var(--accent);border-radius:10px;
    background:linear-gradient(180deg, rgba(255,92,200,.08), rgba(20,10,30,.4));
    box-shadow:0 0 40px rgba(255,92,200,.25);display:flex;align-items:center;justify-content:center}
  #plane2d .label{position:absolute;top:6px;left:10px;font-size:13px;letter-spacing:2px;
    color:var(--accent);opacity:.8}
  #world .label{position:absolute;top:-26px;left:10px;font-size:13px;letter-spacing:2px;color:var(--mood);opacity:.8}
  .props{position:relative;width:100%;height:100%}
  /* spawned prop */
  .prop{position:absolute;font-size:34px;line-height:1;cursor:default;
    filter:drop-shadow(0 0 8px rgba(57,230,200,.6));transition:transform .4s,opacity .6s;
    user-select:none;animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .prop.flat{ /* 2D-only: no volume, lives on the plane */ color:var(--accent);
    filter:drop-shadow(0 0 6px rgba(255,92,200,.7))}
  .prop.vol{ /* 3D-only: only exists in the volume */ color:var(--mood)}
  .prop.dying{opacity:0;transform:scale(.3) rotate(40deg)}
  /* ----- cohost body (wizard) ----- */
  #body{position:absolute;left:50%;top:14%;transform:translateX(-50%);
    width:160px;height:200px;transition:transform .5s}
  .hat{width:0;height:0;margin:0 auto;border-left:55px solid transparent;
    border-right:55px solid transparent;border-bottom:80px solid #2a1d5e;
    position:relative;filter:drop-shadow(0 0 10px var(--mood))}
  .hat:after{content:"W";position:absolute;left:-9px;top:42px;color:var(--mood);font-weight:700}
  .eye{width:120px;height:60px;margin:6px auto 0;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #0a2, #031 80%);
    border:3px solid var(--mood);overflow:hidden;position:relative;
    box-shadow:0 0 24px var(--mood)}
  .pupil{position:absolute;width:22px;height:22px;border-radius:50%;background:#bff;
    left:50%;top:50%;transform:translate(-50%,-50%);transition:left .08s,top .08s;
    box-shadow:0 0 12px #fff}
  .mouth{width:70px;height:10px;margin:10px auto 0;border-radius:0 0 40px 40px;
    background:var(--accent);transition:height .06s;box-shadow:0 0 14px var(--accent)}
  /* ----- Poincare manifold disk ----- */
  #manifold{position:absolute;right:18px;bottom:18px;width:240px;height:240px;
    border-radius:50%;border:1px solid rgba(57,230,200,.4);
    background:radial-gradient(circle at 50% 50%, rgba(10,30,40,.5), rgba(2,6,10,.7));
    box-shadow:0 0 30px rgba(57,230,200,.18)}
  #manifold canvas{width:100%;height:100%;border-radius:50%}
  #manifold .cap{position:absolute;top:-18px;left:0;font-size:11px;color:var(--mood);opacity:.7;letter-spacing:1px}
  /* ----- HUD ----- */
  #hud{position:absolute;left:14px;top:12px;font-size:12px;line-height:1.5;opacity:.75;
    text-shadow:0 0 6px #000}
  #hud b{color:var(--mood)}
  #fx{position:absolute;inset:0;pointer-events:none}
  .spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;
    box-shadow:0 0 8px var(--mood);animation:fade 1.4s linear forwards}
  @keyframes fade{to{opacity:0;transform:translateY(-30px) scale(.4)}}
  #movie .hat{filter:drop-shadow(0 0 14px #ffcf6a)}
  #movie .eye{border-color:#ffcf6a;box-shadow:0 0 24px #ffcf6a}
</style>
</head>
<body>
<div id="stage">
  <div id="body">
    <div class="hat"></div>
    <div class="eye"><div class="pupil" id="pupil"></div></div>
    <div class="mouth" id="mouth"></div>
  </div>

  <!-- Box3D volume world -->
  <div id="world"><span class="label">BOX3D · volume</span>
    <div class="face f1"></div><div class="face f2"></div><div class="face f3"></div>
    <div class="face f4"></div><div class="face f5"></div><div class="face f6"></div>
    <div class="props" id="props3d"></div>
  </div>

  <!-- Box2D flat plane -->
  <div id="plane2d"><span class="label">BOX2D · flat plane</span>
    <div class="props" id="props2d"></div>
  </div>

  <!-- Poincaré manifold explainer -->
  <div id="manifold"><span class="cap">POINCARÉ DISK · the manifold</span>
    <canvas id="mcanvas" width="240" height="240"></canvas>
  </div>

  <div id="hud">
    <div><b>WuBu World</b> — cohost body</div>
    <div>dim: <span id="dim">3D</span> · props: <span id="pcount">0</span></div>
    <div>mood: <span id="moodtxt">happy</span></div>
  </div>
  <div id="fx"></div>
</div>

<script>
/* ============== state ============== */
const S = {
  dim: '3d',            // '3d' (Box3D volume) or '2d' (Box2D plane)
  mood: 'happy',
  speaking: false,
  props: [],            // {el, kind:'flat'|'vol', host, born, manifold:[x,y]}
  manifoldPts: [],      // Poincaré coords for explainer
};

/* ============== OBS bridge ============== */
/* reads face/face_state.json (same as the wizard overlay) so the cohost's
   speech/mood drive this world too. Falls back to a live micro-loop. */
async function pollState(){
  try{
    const r = await fetch('face_state.json?t='+Date.now());
    if(r.ok){ const j = await r.json();
      if(j.mood) setMood(j.mood);
      if(j.speaking!==undefined) setSpeaking(j.speaking);
      if(j.text) document.getElementById('dim').title = j.text;
    }
  }catch(e){}
  setTimeout(pollState, 800);
}
pollState();

/* ============== dimension flip (Paper Mario) ============== */
function flipDim(to){
  S.dim = to || (S.dim==='3d' ? '2d' : '3d');
  const world = document.getElementById('world');
  const plane = document.getElementById('plane2d');
  const dimTxt = document.getElementById('dim');
  if(S.dim==='3d'){
    world.style.transform = 'translate(-50%,-50%) rotateX(58deg) rotateZ(0deg)';
    world.style.opacity = 1;
    plane.style.opacity = 0;
    world.style.pointerEvents='auto'; plane.style.pointerEvents='none';
    dimTxt.textContent = '3D · Box3D';
    spawnFX(50);
  } else {
    world.style.transform = 'translate(-50%,-50%) rotateX(0deg) rotateZ(0deg) scale(.4)';
    world.style.opacity = 0;
    plane.style.opacity = 1;
    plane.style.pointerEvents='auto';
    dimTxt.textContent = '2D · Box2D (paper)';
    spawnFX(50);
  }
  // move 3D-only props out in 2D, 2D-only props out in 3D (the joke made literal)
  S.props.forEach(p=>{
    const visibleIn = (p.kind==='vol') ? '3d' : '2d';
    p.el.style.opacity = (visibleIn===S.dim) ? 1 : 0.06;
  });
}

/* ============== spawn props (2D-only vs 3D-only) ============== */
const FLAT = ['▭','◻','▤','❏','□','▢'];  // exist only on the flat plane
const VOL  = ['◉','⬢','★','⬟','❂','◆'];  // need volume; vanish if flattened
function spawnProp(kind){
  const el = document.createElement('div');
  el.className = 'prop ' + (kind==='flat'?'flat':'vol');
  el.textContent = kind==='flat' ? FLAT[Math.random()*FLAT.length|0]
                                      : VOL[Math.random()*VOL.length|0];
  const host = (kind==='flat')
      ? document.getElementById('props2d')
      : document.getElementById('props3d');
  el.style.left = (8 + Math.random()*78) + '%';
  el.style.top  = (10 + Math.random()*70) + '%';
  el.style.opacity = ((kind==='flat' && S.dim==='2d') || (kind==='vol' && S.dim==='3d')) ? 1 : 0.06;
  host.appendChild(el);
  // also drop a point on the Poincaré manifold (the explainer)
  const ang = Math.random()*Math.PI*2, r = 0.15 + Math.random()*0.78;
  const mp = [Math.cos(ang)*r, Math.sin(ang)*r];
  S.manifoldPts.push(mp);
  S.props.push({el, kind, host, manifold:mp});
  document.getElementById('pcount').textContent = S.props.length;
  drawManifold();
  if(S.props.length>40) removeProp(S.props[0]);
}
function removeProp(p){
  p.el.classList.add('dying');
  setTimeout(()=>p.el.remove(), 600);
  S.props = S.props.filter(x=>x!==p);
  S.manifoldPts = S.manifoldPts.filter(x=>x!==p.manifold);
  drawManifold();
  document.getElementById('pcount').textContent = S.props.length;
}

/* ============== Poincaré disk manifold renderer ============== */
const mc = document.getElementById('mcanvas');
const mctx = mc.getContext('2d');
function poincareToPx(p){ // map unit-disk coord -> 240px canvas
  const cx=120, cy=120, R=110;
  return [cx + p[0]*R, cy - p[1]*R];
}
function drawManifold(){
  mctx.clearRect(0,0,240,240);
  // concentric hierarchy rings (root center -> leaves boundary)
  for(let i=1;i<=4;i++){ mctx.beginPath();
    mctx.arc(120,120, i/4*108, 0, Math.PI*2);
    mctx.strokeStyle='rgba(57,230,200,'+(0.10+0.05*i)+')'; mctx.stroke(); }
  // boundary
  mctx.beginPath(); mctx.arc(120,120,110,0,Math.PI*2);
  mctx.strokeStyle='rgba(57,230,200,.5)'; mctx.stroke();
  // points
  S.manifoldPts.forEach(p=>{
    const [x,y]=poincareToPx(p);
    mctx.beginPath(); mctx.arc(x,y,3,0,Math.PI*2);
    mctx.fillStyle = (Math.hypot(p[0],p[1])>0.7)?'#ff5cc8':'#39e6c8';
    mctx.fill();
  });
}

/* ============== eye + mouth (reuse cohost_line.wav via face_state) ============== */
const pupil = document.getElementById('pupil');
const mouth = document.getElementById('mouth');
function eyeTrack(){
  // follow cursor (like the wizard overlay)
  document.addEventListener('mousemove', e=>{
    const r = document.getElementById('body').getBoundingClientRect();
    const cx = r.left+r.width/2, cy = r.top+r.height/2;
    const dx=(e.clientX-cx)/window.innerWidth, dy=(e.clientY-cy)/window.innerHeight;
    pupil.style.left = (50+dx*40)+'%'; pupil.style.top = (50+dy*40)+'%';
  });
}
eyeTrack();
let mouthRAF=null;
function animateMouth(){
  // WebAudio amplitude -> mouth height (same trick as wizard overlay)
  try{
    const ctxA = new (window.AudioContext||window.webkitAudioContext)();
    const src = ctxA.createMediaElementSource(new Audio('cohost_line.wav'));
    const an = ctxA.createAnalyser(); src.connect(an); an.connect(ctxA.destination);
    const buf = new Uint8Array(an.frequencyBinCount);
    (function loop(){
      an.getByteTimeDomainData(buf);
      let peak=0; for(let i=0;i<buf.length;i++){const v=Math.abs(buf[i]-128); if(v>peak)peak=v;}
      mouth.style.height = (8 + peak/128*26) + 'px';
      mouthRAF = requestAnimationFrame(loop);
    })();
  }catch(e){ /* audio may be blocked until gesture; mouth stays idle */ }
}
function setSpeaking(v){
  if(v===S.speaking) return; S.speaking=v;
  if(v && !mouthRAF) animateMouth();
  if(!v && mouthRAF){ cancelAnimationFrame(mouthRAF); mouthRAF=null; mouth.style.height='10px'; }
}
function setMood(m){
  S.mood=m; document.getElementById('moodtxt').textContent=m;
  const c = m==='happy'?'#39e6c8': m==='movie'?'#ffcf6a': m==='alert'?'#ff5cc8':'#9cf';
  document.documentElement.style.setProperty('--mood', c);
}

/* ============== particle FX ============== */
const fx = document.getElementById('fx');
function spawnFX(n){
  for(let i=0;i<n;i++){
    const s=document.createElement('div'); s.className='spark';
    s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*100)+'%';
    fx.appendChild(s); setTimeout(()=>s.remove(),1400);
  }
}

/* ============== keyboard / OBS hotkey control ============== */
window.addEventListener('keydown', e=>{
  if(e.key==='f'||e.key==='F') flipDim();
  if(e.key==='3') flipDim('3d');
  if(e.key==='2') flipDim('2d');
  if(e.key==='a') spawnProp('flat');
  if(e.key==='d') spawnProp('vol');
  if(e.key==='c'){ S.props.slice().forEach(removeProp); }
});

/* ============== OBS WebSocket-style control (optional) ============== */
/* The host (WuBuMedia) can call window.__wubu_world.flip/spawn from outside. */
window.__wubu_world = {
  flip: flipDim,
  spawn2D: ()=>spawnProp('flat'),
  spawn3D: ()=>spawnProp('vol'),
  clear: ()=>S.props.slice().forEach(removeProp),
  setMood,
};

/* ============== auto demo loop (when idle / not driven by cohost) ============== */
let demo=0;
setInterval(()=>{
  if(S.props.length<6){ spawnProp(Math.random()<0.5?'flat':'vol'); }
  if(demo++%7===0) spawnFX(20);
}, 2600);

// initial
flipDim('3d');
for(let i=0;i<4;i++) spawnProp(i%2?'flat':'vol');
drawManifold();
</script>
</body>
</html>
